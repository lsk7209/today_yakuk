name: Publish Content Queue

# 하루 최대 10건 자동 발행 (한국 시간 02:00, 06:00, 10:00, 14:00, 18:00에 2건씩)

on:
  schedule:
    # UTC: 전날 17:00, 21:00 및 당일 01:00, 05:00, 09:00
    - cron: '0 1,5,9,17,21 * * *'
  workflow_dispatch: # 수동 실행도 가능

jobs:
  publish:
    name: Publish Content Queue
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish content queue
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          PUBLISH_LIMIT: '2'
          # Google Indexing
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: npm run publish:queue

      - name: Report result
        if: always()
        run: |
          echo "Content publishing job completed at $(date)"
          echo "Check the logs above for published items."

