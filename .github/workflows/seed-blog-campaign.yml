name: Seed Blog Campaign

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/seed-blog-campaign.yml"
      - "content/blog-campaign-2026-05-04.json"
      - "content/title-candidates-2026-05-04.csv"
      - "scripts/prepare-blog-campaign.ts"
  workflow_dispatch:

jobs:
  seed:
    name: Seed 100 scheduled blog posts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate and insert campaign
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run prepare:blog-campaign -- --insert
