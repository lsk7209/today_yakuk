name: Turso Usage Monitor

# org 전체 Turso rows_read 사용량을 매일 점검.
# 설정된 운영 예산의 기본 80%에서 경고. 수집 오류는 실패로 표시.
on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST (00:00 UTC)
  workflow_dispatch:

jobs:
  check-usage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test Turso usage monitor
        run: node --test scripts/check-turso-usage.test.mjs

      - name: Check Turso usage
        run: node scripts/check-turso-usage.mjs
        env:
          TURSO_PLATFORM_TOKEN: ${{ secrets.TURSO_PLATFORM_TOKEN }}
          TURSO_READ_LIMIT: ${{ vars.TURSO_READ_LIMIT }}
          TURSO_WARN_PCT: ${{ vars.TURSO_WARN_PCT }}
          FAIL_ON_TURSO_USAGE_WARN: ${{ vars.FAIL_ON_TURSO_USAGE_WARN }}
