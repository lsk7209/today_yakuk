name: Generate Pharmacy Content

on:
  schedule:
    # 한국 시간 08:00 (UTC 23:00)
    # Aggressive Mode: Every 3 hours during active time (KST 08:00 ~ 23:00)
    # UTC: 23, 02, 05, 08, 11, 14
    - cron: "0 23,2,5,8,11,14 * * *"
  # Gemini 기반 대량 생성은 중단합니다. 필요 시에만 수동 실행하세요.
  workflow_dispatch:
    inputs:
      limit:
        description: "생성할 컨텐츠 개수"
        required: false
        default: "6"

jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: generate-content
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: |
          set -e
          missing=0
          for k in TURSO_DATABASE_URL TURSO_AUTH_TOKEN GEMINI_API_KEY; do
            if [ -z "${!k}" ]; then
              echo "::error title=Missing secret::환경변수 ${k} 가 비어있습니다. GitHub Secrets 설정을 확인하세요."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Generate pharmacy content
        run: npm run generate:content ${{ github.event.inputs.limit || '10' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
