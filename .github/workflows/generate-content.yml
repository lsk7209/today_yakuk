name: Generate Pharmacy Content

on:
  # Gemini 기반 대량 생성은 중단했습니다. 비용 검토 후 수동으로만 실행합니다.
  workflow_dispatch:
    inputs:
      limit:
        description: "생성할 컨텐츠 개수"
        required: false
        default: "6"

jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: generate-content
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: |
          set -e
          missing=0
          for k in TURSO_DATABASE_URL TURSO_AUTH_TOKEN GEMINI_API_KEY; do
            if [ -z "${!k}" ]; then
              echo "::error title=Missing secret::환경변수 ${k} 가 비어있습니다. GitHub Secrets 설정을 확인하세요."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Generate pharmacy content
        shell: bash
        run: |
          set -euo pipefail
          limit="${LIMIT_INPUT:-6}"
          if ! [[ "$limit" =~ ^[1-9][0-9]*$ ]] || [ "$limit" -gt 50 ]; then
            echo "::error title=Invalid limit::limit must be an integer between 1 and 50"
            exit 1
          fi
          npm run generate:content -- "$limit"
        env:
          LIMIT_INPUT: ${{ github.event.inputs.limit || '6' }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
