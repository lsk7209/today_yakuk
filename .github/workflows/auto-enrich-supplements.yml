name: Auto Enrich Supplements

on:
  schedule:
    # 매일 3시간 간격으로 실행 (하루 8번, 예약 실행 기본값 기준 최대 120개 처리)
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "처리할 아이템 개수"
        required: false
        default: "100"

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Check required secrets
        id: preflight
        shell: bash
        run: |
          missing=()
          [ -z "$TURSO_DATABASE_URL" ] && missing+=("TURSO_DATABASE_URL")
          [ -z "$TURSO_AUTH_TOKEN" ] && missing+=("TURSO_AUTH_TOKEN")
          [ -z "$FOOD_SAFETY_API_KEY" ] && missing+=("FOOD_SAFETY_API_KEY")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice::Skipping supplement enrichment. Missing secrets: ${missing[*]}"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          FOOD_SAFETY_API_KEY: ${{ secrets.FOOD_SAFETY_API_KEY }}

      - name: Install dependencies
        if: steps.preflight.outputs.run == 'true'
        run: npm ci

      - name: Run enrichment
        if: steps.preflight.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          limit="${LIMIT_INPUT:-15}"
          cursor="${GITHUB_RUN_NUMBER:-0}"
          if ! [[ "$limit" =~ ^[1-9][0-9]*$ ]] || [ "$limit" -gt 500 ]; then
            echo "::error title=Invalid limit::limit must be an integer between 1 and 500"
            exit 1
          fi
          npx ts-node --project tsconfig.sync.json scripts/auto-enrich-supplements.ts "$limit" "$cursor"
        env:
          LIMIT_INPUT: ${{ github.event.inputs.limit || '15' }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          FOOD_SAFETY_API_KEY: ${{ secrets.FOOD_SAFETY_API_KEY }}
