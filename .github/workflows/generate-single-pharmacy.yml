name: Generate Single Pharmacy Content

on:
  workflow_dispatch:
    inputs:
      hpid:
        description: '약국 HPID (예: C1109587)'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate pharmacy content and summary
        run: |
          npm run generate:single -- "$HPID"
          npm run generate:summary -- "$HPID"
        env:
          HPID: ${{ github.event.inputs.hpid }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
