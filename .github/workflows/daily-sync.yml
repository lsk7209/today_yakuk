name: Scheduled Public Data Sync

on:
  schedule:
    # Pharmacies: daily 04:00 KST = 19:00 UTC
    - cron: "0 19 * * *"
    # Wiki source data: Monday 04:30 KST = Sunday 19:30 UTC
    - cron: "30 19 * * 0"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated sources: pharmacies,hff,medicines"
        required: false
        default: "pharmacies,hff,medicines"
      hff_mode:
        description: "HFF sync mode: all or start index"
        required: false
        default: "all"
      medicines_mode:
        description: "Medicine sync mode: all or page number"
        required: false
        default: "all"

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: public-data-sync
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve sync plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$EVENT_SCHEDULE" in
              "0 19 * * *")
                echo "sources=pharmacies" >> "$GITHUB_OUTPUT"
                echo "hff_mode=all" >> "$GITHUB_OUTPUT"
                echo "medicines_mode=all" >> "$GITHUB_OUTPUT"
                ;;
              "30 19 * * 0")
                echo "sources=hff,medicines" >> "$GITHUB_OUTPUT"
                echo "hff_mode=all" >> "$GITHUB_OUTPUT"
                echo "medicines_mode=all" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "::error title=Unknown schedule::$EVENT_SCHEDULE"
                exit 1
                ;;
            esac
          else
            sources="$INPUT_SOURCES"
            hff_mode="$INPUT_HFF_MODE"
            medicines_mode="$INPUT_MEDICINES_MODE"
            if ! [[ "$sources" =~ ^(pharmacies|hff|medicines)(,(pharmacies|hff|medicines))*$ ]]; then
              echo "::error title=Invalid sources::Use a comma-separated allowlist of pharmacies,hff,medicines"
              exit 1
            fi
            if ! [[ "$hff_mode" =~ ^(all|[1-9][0-9]*)$ ]]; then
              echo "::error title=Invalid HFF mode::Use all or a positive start index"
              exit 1
            fi
            if ! [[ "$medicines_mode" =~ ^(all|[1-9][0-9]*)$ ]]; then
              echo "::error title=Invalid medicine mode::Use all or a positive page number"
              exit 1
            fi
            echo "sources=${sources}" >> "$GITHUB_OUTPUT"
            echo "hff_mode=${hff_mode}" >> "$GITHUB_OUTPUT"
            echo "medicines_mode=${medicines_mode}" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SOURCES: ${{ github.event.inputs.sources || 'pharmacies,hff,medicines' }}
          INPUT_HFF_MODE: ${{ github.event.inputs.hff_mode || 'all' }}
          INPUT_MEDICINES_MODE: ${{ github.event.inputs.medicines_mode || 'all' }}

      - name: Ensure Turso schema is compatible
        run: node scripts/init-turso-schema.mjs
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Run selected public-data sync
        run: npm run sync:public-data -- --only="$SYNC_SOURCES" --hff-mode="$HFF_MODE" --medicines-mode="$MEDICINES_MODE"
        env:
          SYNC_SOURCES: ${{ steps.plan.outputs.sources }}
          HFF_MODE: ${{ steps.plan.outputs.hff_mode }}
          MEDICINES_MODE: ${{ steps.plan.outputs.medicines_mode }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          FOOD_SAFETY_API_KEY: ${{ secrets.FOOD_SAFETY_API_KEY }}
          MEDICINE_API_KEY: ${{ secrets.MEDICINE_API_KEY }}
